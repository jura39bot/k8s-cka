let Q=null;
function startQuiz(domId){
 const pool=[];
 DATA.domains.forEach(d=>{
   if(domId&&d.id!==domId)return;
   (DATA.questions[d.id]||[]).forEach(q=>pool.push({...q,dom:d.id}));
 });
 if(!pool.length)return toast("No questions");
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 Q={list:pool.slice(0,QPER),i:0,ok:0,ko:0,answered:false,pick:-1};
 go("quiz");
}
function quizScreen(a){
 if(!Q)return go("home");
 const q=Q.list[Q.i]; const pct=Math.round(100*Q.i/Q.list.length);
 a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>QCM</h2><span style="width:40px"></span></div>
 <div class="between" style="margin-bottom:8px"><span class="pill">Question ${Q.i+1} / ${Q.list.length}</span>
 <span class="tiny muted">${Q.ok} ✓ · ${Q.ko} ✗</span></div>
 <div class="bar" style="margin-bottom:14px"><i style="width:${pct}%"></i></div>
 <div class="cardq"><div class="tiny muted">${esc(domainById(q.dom).n)}</div>
 <div style="font-size:18px;font-weight:750;margin-top:8px;line-height:1.4">${esc(q.q)}</div></div>
 <div id="o">${q.o.map((x,i)=>{let cls="choice";
   if(Q.answered){ if(i===q.a)cls+=" ok"; else if(i===Q.pick)cls+=" no"; }
   return `<button class="${cls}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`}).join("")}</div>
 ${Q.answered?`<div class="fb ${Q.pick===q.a?"ok":"no"}">
   ${Q.pick===q.a?"✓ Correct":"✗ Wrong — the answer is <b>"+esc(q.o[q.a])+"</b>"}
   <div class="tiny" style="margin-top:6px;opacity:.9">${esc(q.w)}</div></div>`:""}
 <div class="feed"><div><button class="btn" id="nx">${Q.answered?(Q.i+1>=Q.list.length?"See results":"Next question"):"Choose an answer"}</button></div></div>`;
 if(!Q.answered){
   a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>{
     Q.pick=+b.dataset.i;Q.answered=true;
     const ok=Q.pick===q.a;
     if(ok){Q.ok++;S.good++;S.xp+=10}else{Q.ko++;S.bad++;S.xp+=2}
     S.history[today()]=S.history[today()]||{xp:0,m:0};
     S.history[today()].xp=(S.history[today()].xp||0)+(ok?10:2);save();render();
   });
 } else {
   $("#nx").onclick=()=>{
     Q.i++;Q.answered=false;Q.pick=-1;
     if(Q.i>=Q.list.length){const ok=Q.ok,n=Q.list.length;Q=null;return endQuiz(ok,n)}
     render();
   };
 }
}
function endQuiz(ok,n){

 a.innerHTML=`<div style="text-align:center;margin-top:6vh"><div style="font-size:60px">${acc>=80?"🎉":acc>=50?"💪":"🌱"}</div>
 <h1 style="margin-top:8px">${acc>=80?"Excellent":acc>=50?"Good":"Keep going"}</h1>

 <div class="grid3"><div class="stat"><b>${ok}</b><i>correct</i></div>

}

/* ---------- timed mock exam ---------- */
let EX=null, EXT=null;
function startMock(){
  const plan=[["arch",5],["work",3],["net",4],["stor",2],["trbl",6]];
  let list=[];
  plan.forEach(([dom,n])=>{
    const pool=(DATA.questions[dom]||[]).slice();
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
    pool.slice(0,n).forEach(q=>list.push({...q,dom}));
  });
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  EX={list,i:0,ans:new Array(list.length).fill(-1),left:7200,start:Date.now(),done:false};
  if(EXT)clearInterval(EXT);
  EXT=setInterval(()=>{
    if(!EX)return;
    EX.left--;
    const el=document.getElementById("clock");
    if(el)el.textContent=fmtTime(EX.left);
    if(EX.left<=0){clearInterval(EXT);submitMock()}
  },1000);
  go("mock");
}
function fmtTime(s){const m=Math.floor(s/60),ss=s%60;return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`}
function mockScreen(a){
  if(!EX)return go("home");
  const q=EX.list[EX.i];
  const answered=EX.ans.filter(x=>x>=0).length;
  a.innerHTML=`<div class="top"><button class="back" onclick="if(confirm('Abandon the mock exam?')){clearInterval(EXT);EX=null;go('home')}">‹</button>
   <h2>Mock exam</h2><span class="pill" id="clock">${fmtTime(EX.left)}</span></div>
  <div class="between" style="margin-bottom:8px"><span class="pill">Question ${EX.i+1} / ${EX.list.length}</span>
  <span class="tiny muted">${answered} answered</span></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(100*answered/EX.list.length)}%"></i></div>
  <div class="cardq"><div class="tiny muted">${esc(domainById(q.dom).n)}</div>
  <div style="font-size:18px;font-weight:750;margin-top:8px;line-height:1.4">${esc(q.q)}</div></div>
  <div id="o">${q.o.map((x,i)=>`<button class="choice ${EX.ans[EX.i]===i?"ok":""}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(x)}</button>`).join("")}</div>
  <div class="spacer"></div>
  <div class="grid2"><button class="btn alt" id="prev" ${EX.i===0?"disabled":""}>◀︎ Previous</button>
  <button class="btn alt" id="next" ${EX.i===EX.list.length-1?"disabled":""}>Next ▶︎</button></div>
  <div style="height:10px"></div>
  <button class="btn" id="sub">Submit — ${answered}/${EX.list.length} answered</button>`;
  a.querySelectorAll("#o .choice").forEach(b=>b.onclick=()=>{EX.ans[EX.i]=+b.dataset.i;render()});
  $("#prev").onclick=()=>{if(EX.i>0){EX.i--;render()}};
  $("#next").onclick=()=>{if(EX.i<EX.list.length-1){EX.i++;render()}};
  $("#sub").onclick=()=>{if(confirm("Submit the exam? You cannot change answers after."))submitMock()};
}
function submitMock(){
  if(!EX||EX.done)return;
  EX.done=true;clearInterval(EXT);
  const ok=EX.list.filter((q,i)=>EX.ans[i]===q.a).length;
  const n=EX.list.length, score=Math.round(100*ok/n);
  const per={};
  EX.list.forEach((q,i)=>{per[q.dom]=per[q.dom]||{ok:0,n:0};per[q.dom].n++;if(EX.ans[i]===q.a)per[q.dom].ok++});
  EX.result={ok,n,score,per,used:7200-EX.left};
  S.history[today()]=S.history[today()]||{xp:0,m:0};
  S.history[today()].m=(S.history[today()].m||0)+Math.round((7200-EX.left)/60);
  S.minutes+=Math.round((7200-EX.left)/60);save();
  go("mockresult");
}
function mockResult(a){
  if(!EX||!EX.result)return go("home");
  const r=EX.result, pass=r.score>=66;
  a.innerHTML=`<div style="text-align:center;margin-top:4vh"><div style="font-size:60px">${pass?"🏅":"📉"}</div>
  <h1 style="margin-top:8px">${r.score}%</h1>
  <p class="muted" style="margin-top:4px">${r.ok} / ${r.n} · threshold 66% · ${pass?"PASS":"FAIL"}</p>
  <p class="tiny muted">time used ${fmtTime(r.used)} of 2:00:00</p></div>
  <div class="spacer"></div>
  <div class="stack">${Object.entries(r.per).map(([d,v])=>{const p=Math.round(100*v.ok/v.n);
    return `<div class="card"><div class="between"><b>${esc(domainById(d).n)}</b><span class="tiny muted">${v.ok}/${v.n} · ${p}%</span></div>
    <div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div></div>`}).join("")}</div>
  <div class="spacer"></div>
  <button class="btn alt" id="rev">🔍 Review the ${r.n-r.ok} mistakes</button>
  <div style="height:10px"></div>
  <button class="btn" onclick="clearInterval(EXT);EX=null;go('home')">Done</button>`;
  $("#rev").onclick=()=>{
    const wrong=EX.list.map((q,i)=>({q,i})).filter(({q,i})=>EX.ans[i]!==q.a);
    a.innerHTML=`<div class="top"><button class="back" onclick="go('mockresult')">‹</button><h2>Mistakes</h2><span style="width:40px"></span></div>
    <div class="stack">${wrong.map(({q,i})=>`<div class="card"><div class="tiny muted">${esc(domainById(q.dom).n)}</div>
      <p style="margin-top:6px;font-weight:700">${esc(q.q)}</p>
      <p class="small" style="margin-top:8px;color:#ff9a9a">Your answer: ${EX.ans[i]>=0?esc(q.o[EX.ans[i]]):"—"}</p>
      <p class="small" style="margin-top:4px;color:#b6ff87">Correct: ${esc(q.o[q.a])}</p>
      <p class="tiny muted" style="margin-top:8px">${esc(q.w)}</p></div>`).join("")||"<p class='muted'>No mistakes.</p>"}</div>`;
  };
}

   <input id="tk" type="password" placeholder="GitHub token (gist scope)" value="${localStorage.getItem(TOKKEY)?"••••••••••":""}">

 <div class="spacer"></div>
 <div class="card"><h3>Settings</h3><div class="spacer"></div>
   <button class="btn alt" id="exp">⬇️ Export</button><div style="height:10px"></div>
   <button class="btn alt" id="rst" style="color:#ff9a9a">♻️ Reset</button></div>
 <p class="tiny muted" style="text-align:center;margin-top:16px">${VERSION} · data stays on your phone</p>`;
 $("#ren").onclick=()=>{const v=prompt("Your name",p.name);if(v&&v.trim()){p.name=v.trim().slice(0,18);save();render()}};
 $("#sy").onclick=()=>{const v=$("#tk").value.trim();if(v&&v.indexOf("•")!==0)localStorage.setItem(TOKKEY,v);syncNow()};
 $("#exp").onclick=()=>{const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
   const u=URL.createObjectURL(b),i=document.createElement("a");i.href=u;i.download="cka-progress.json";i.click();URL.revokeObjectURL(u)};
 $("#rst").onclick=()=>{if(confirm("Erase all progress?")){localStorage.removeItem(KEY);S=blank();location.reload()}};
}
async function syncNow(){
 const t=localStorage.getItem(TOKKEY); if(!t)return toast("Add a GitHub token");
 const base="https://api.github.com";
 const h={Authorization:"***"+t,Accept:"application/vnd.github+json","Content-Type":"application/json"};
 try{
  if(S.gistId){const r=await fetch(base+"/gists/"+S.gistId,{headers:h});
    if(r.ok){const g=await r.json();const f=g.files&&g.files["cka-progress.json"];
      if(f&&f.content){try{const remote=JSON.parse(f.content);
        S.xp=Math.max(S.xp,remote.xp||0);S.good=Math.max(S.good,remote.good||0);S.bad=Math.max(S.bad,remote.bad||0);
        S.seen=Object.assign({},remote.seen||{},S.seen);
        S.history=Object.assign({},remote.history||{},S.history);
      }catch(e){}}}}
  const payload=JSON.stringify({description:"CKA progress (private)",public:false,
    files:{"cka-progress.json":{content:JSON.stringify(S)}}});
  const r2=S.gistId?await fetch(base+"/gists/"+S.gistId,{method:"PATCH",headers:h,body:payload})
                    :await fetch(base+"/gists",{method:"POST",headers:h,body:payload});
  if(!r2.ok)throw new Error("HTTP "+r2.status);
  const g2=await r2.json();S.gistId=g2.id;S.synced=Date.now();save();toast("Synced ✓");render();
 }catch(e){toast("Failed: "+e.message)}
}

setInterval(()=>{if(!S.profile)return;const t=today();
 S.history[t]=S.history[t]||{xp:0,m:0};S.history[t].m=(S.history[t].m||0)+1/6;S.minutes+=1/6;save()},10000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});
render();
</script>
